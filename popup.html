<!DOCTYPE html>
<html>
<head>
    <title>Text/Image Sender</title>
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        .file-input {
            display: none;
        }
        .upload-btn {
            background-color: #f0f0f0;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            border: 1px solid #ccc;
        }
        .upload-btn:hover {
            background-color: #e0e0e0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #preview {
            max-width: 100%;
            margin-top: 10px;
        }
        .preview-container {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Send Text or Image</h3>
        <textarea id="textInput" placeholder="Enter text here..."></textarea>
        
        <label class="upload-btn" for="imageInput">
            Choose Image
        </label>
        <input type="file" id="imageInput" class="file-input" accept="image/*">
        
        <div class="preview-container" id="previewContainer">
            <img id="preview">
        </div>

        <button id="sendBtn">Send to Server</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
